version: "3.9"

services:
  database:
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database

volumes:
  postgres_data:
